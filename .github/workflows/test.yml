name: Check renderer
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 poppler-utils fonts-liberation
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build.py examples/crib-sheet.md --out output --date 2026-09-06
      - run: pdftoppm -scale-to 1800 -png -singlefile output/crib-sheet.pdf output/check
      - uses: actions/upload-artifact@v4
        with:
          name: sample-sheet
          path: output/
